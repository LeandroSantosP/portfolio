    <style>
        body {
            background-color: #f7f3e8;
            font-family: 'Karla', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .fraunces { font-family: 'Fraunces', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .sticky-nav {
            backdrop-filter: blur(12px);
        }
        .soft-shadow {
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }
        section {
            padding-top: 80px;
            padding-bottom: 80px;
        }
        /* Theme variables to allow quick dark/light switching.
           The TopNav toggles the 'dark' class on <html>, which flips these.
        */
        :root {
            --bg: #f7f3e8;
            --text: #1a1a1a;
            --surface: #fffcf5;
            --primary: #d4af37;
            --on-primary: #f7f3e8;
            --outline: #cbc0a6;
            --secondary: #4f4940;
            --bottle: #0f5132;
            --cream: #f7f3e8;
            --cream-soft: #e6dcc0;
            --band: #1a1a1a;
        }

        .dark {
            --bg: #141311;
            --text: #f5f0e0;
            --surface: #211f1a;
            --primary: #e8c766;
            --on-primary: #1a1a1a;
            --outline: #3a362d;
            --secondary: #c9c0ab;
            --bottle: #1f9d63;
            --cream: #f7f3e8;
            --cream-soft: #e6dcc0;
            --band: #262624;
        }

        /* Apply variables to base elements */
        body { background-color: var(--bg); color: var(--text); }
        /* Ensure nav uses the surface variable so header follows theme */
        nav { background-color: var(--surface) !important; color: var(--text) !important; }
        /* Stronger dark-specific override in case Tailwind utilities add transparency */
        html.dark nav { background-color: var(--surface) !important; color: var(--text) !important; }
        html.dark nav * { color: var(--text) !important; }
        /* Contact button uses theme tokens so it flips automatically when variables change */
        .topnav-contact { background-color: var(--primary) !important; color: var(--on-primary) !important; }
        html.dark .topnav-contact { background-color: var(--primary) !important; color: var(--on-primary) !important; }
        .topnav-contact:hover { opacity: 0.9; }

        /* Utility overrides for a consistent theme switch.
           --primary drives CTA button backgrounds (gold).
           --text drives heading/ink text so headlines stay dark ink.
        */
        .text-on-background { color: var(--text) !important; }
        .text-primary { color: var(--text) !important; }
        .text-secondary { color: var(--secondary) !important; }
        .text-on-primary { color: var(--on-primary) !important; }

        .bg-surface, .bg-surface-container, .bg-surface-container-high, .bg-surface-container-low, .bg-surface-container-lowest, .bg-surface-container-highest {
            background-color: var(--surface) !important;
        }
        .bg-primary { background-color: var(--primary) !important; }

        .border-outline-variant { border-color: var(--outline) !important; }
        .outline-variant { border-color: var(--outline) !important; }
    </style>
